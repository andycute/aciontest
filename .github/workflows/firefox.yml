name: Firefox VNC

# 推送到 main 自动触发；也可手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firefox:
    runs-on: ubuntu-latest
    # 2 小时会话（GitHub 单个 job 上限 6h，公共仓库不耗配额）
    timeout-minutes: 120
    steps:
      - name: Start Firefox (jlesage/firefox, noVNC :5800)
        run: |
          # 密码在 runner 上运行时从远端 URL 读取，不写死在仓库里
          PASS=$(curl -s --max-time 15 "https://mac.401001.xyz/a.txt" | tr -d '\r\n')
          if [ -z "$PASS" ]; then
            echo "::error::无法从 https://mac.401001.xyz/a.txt 读取密码"
            exit 1
          fi
          echo "::add-mask::$PASS"   # 防止密码误入日志
          # jlesage/firefox: noVNC 网页在 5800, VNC 在 5900; PASSWORD 为 VNC 登录密码
          docker run -d --name firefox --shm-size 2g \
            -e PASSWORD="$PASS" \
            -p 5800:5800 -p 5900:5900 \
            jlesage/firefox:latest

      - name: Wait for web UI (port 5800)
        run: |
          for i in $(seq 120); do
            if curl -sf -o /dev/null "http://localhost:5800"; then
              echo "UI 就绪,端口 5800"
              echo "PORT=5800" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "=== 诊断: 5800 在等待窗口内未就绪 ==="
          echo "--- docker ps ---"; docker ps -a
          echo "--- docker port ---"; docker port firefox
          echo "--- runner 监听端口 ---"; (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | head -20
          echo "--- 完整容器日志 ---"; docker logs firefox
          exit 1

      - name: Start cloudflared tunnel & hold session
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url "http://localhost:${PORT:-5800}" --no-autoupdate > /tmp/cf.log 2>&1 &
          TURL=""
          for i in $(seq 60); do
            TURL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$TURL" ] && break
            sleep 2
          done
          if [ -z "$TURL" ]; then
            echo "隧道建立失败"; cat /tmp/cf.log; exit 1
          fi
          echo "==================================================="
          echo "  Firefox 已就绪,在浏览器打开:"
          echo "  $TURL"
          echo "  noVNC 登录密码: 你设置的 a.txt 内容 (用户名留空或随意)"
          echo "  会话时长: 2 小时;到 Actions 页面 Cancel 可提前结束"
          echo "==================================================="
          end=$((SECONDS + 6900))
          while [ $SECONDS -lt $end ]; do
            docker inspect -f '{{.State.Running}}' firefox | grep -q true || { echo "容器已停止,会话结束"; exit 0; }
            sleep 30
          done
