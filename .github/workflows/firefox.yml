name: Firefox VNC

# 推送到 main 自动触发；也可手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start Firefox (KasmVNC web)
        run: |
          PASS="${{ secrets.VNC_PASSWORD }}"
          ARGS=()
          if [ -n "$PASS" ]; then
            ARGS=(-e PASSWORD="$PASS")
            echo "已启用登录密码(来自 repo secret VNC_PASSWORD,日志中自动打码)"
          else
            echo "::warning::未设置 secrets.VNC_PASSWORD,本次会话无密码——仓库是公开的,任何翻到日志的人都能进入这个 Firefox!"
          fi
          docker run -d --name firefox --shm-size 2g \
            -e TZ=Asia/Shanghai \
            -e TITLE="Actions Firefox" \
            "${ARGS[@]}" \
            -p 3000:3000 \
            lscr.io/linuxserver/firefox:latest

      - name: Wait for web UI
        run: |
          for i in $(seq 45); do
            curl -sf -o /dev/null http://localhost:3000 && { echo "KasmVNC ready"; exit 0; }
            sleep 2
          done
          echo "--- container logs ---"
          docker logs firefox
          exit 1

      - name: Start cloudflared tunnel & hold session
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:3000 --no-autoupdate > /tmp/cf.log 2>&1 &
          TURL=""
          for i in $(seq 60); do
            TURL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$TURL" ] && break
            sleep 2
          done
          if [ -z "$TURL" ]; then
            echo "隧道建立失败"; cat /tmp/cf.log; exit 1
          fi
          echo "==================================================="
          echo "  Firefox 已就绪,在浏览器打开:"
          echo "  $TURL"
          echo "  登录用户名: kasm-user"
          echo "  密码: 你设置的 VNC_PASSWORD secret(未设置则免登录)"
          echo "  会话最长 30 分钟;到 Actions 页面 Cancel 立即结束"
          echo "==================================================="
          end=$((SECONDS + 1440))
          while [ $SECONDS -lt $end ]; do
            docker inspect -f '{{.State.Running}}' firefox | grep -q true || { echo "容器已停止,会话结束"; exit 0; }
            sleep 30
          done
