name: Debug session

# tmate.io 从 runner 出网不稳(连续两次挂在 wait tmate-ready),
# 改为仅手动触发;自建 tmate 服务端后再启用
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    # 防止忘记关，最多挂 30 分钟
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          # 只允许触发 workflow 的 GitHub 账户（其 GitHub 公钥）连接
          # 前提：你的 GitHub 账户里已添加过 SSH 公钥（Settings → SSH and GPG keys）
          limit-access-to-actor: true
          # 10 分钟内没人连接就自动结束，别干挂着
          connect-timeout-seconds: 600
